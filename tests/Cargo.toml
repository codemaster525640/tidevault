[package]
name = "tidevault-tests"
version = "0.3.0"
edition = "2021"
publish = false

[dev-dependencies]
tv-engine = { path = "../apps/tv-engine" }
tv-kernel = { path = "../domains/tv-kernel" }
tv-payments = { path = "../domains/tv-payments" }
tv-ledger = { path = "../domains/tv-ledger" }
